version: 1
# Rewrites and redirects are not part of this build spec. Amplify Hosting ignores
# public/_redirects (a Netlify file). customHttp.yml can set headers only.
# Console rules: amplifyConsoleRedirects.js and DEPLOYMENT.md.
frontend:
  phases:
    preBuild:
      commands:
        - cd project8x-website
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: project8x-website/build
    files:
      - '**/*'
  cache:
    paths:
      - project8x-website/node_modules/**/*